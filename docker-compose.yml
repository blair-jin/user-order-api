services:
  mysql-server:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: userorder
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app1234
    volumes:
      - mysql-data:/var/lib/mysql

  redis-server:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
